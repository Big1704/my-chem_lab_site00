<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ChemLab Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --lab-navy:#0B2E33;
            --lab-navy-deep:#081F23;
            --lab-teal:#16C79A;
            --lab-amber:#FFB238;
            --lab-paper:#F7F5F0;
            --lab-ink:#1B262C;
            --lab-line:#E4E0D6;
        }

        *{ font-family:'Sarabun', sans-serif; }
        .mono{ font-family:'Space Mono', monospace; }

        body{
            background:
                radial-gradient(circle at 15% 20%, rgba(22,199,154,.10), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255,178,56,.08), transparent 40%),
                var(--lab-navy-deep);
            min-height:100vh;
        }

        .lab-wrapper{ max-width:840px; width:100%; }

        .lab-card{
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
            border:1px solid rgba(255,255,255,.06);
        }

        /* ---------- Left panel: signature flask ---------- */
        .lab-side{
            background:
                linear-gradient(180deg, var(--lab-navy) 0%, var(--lab-navy-deep) 100%);
            position:relative;
            min-height:100%;
            padding:2.5rem 2rem;
            color:var(--lab-paper);
            overflow:hidden;
        }

        .lab-grid-lines{
            position:absolute; inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size:26px 26px;
            pointer-events:none;
        }

        .element-tile{
            width:52px; height:52px;
            border:1.5px solid rgba(22,199,154,.55);
            border-radius:8px;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            color:var(--lab-teal);
            background:rgba(22,199,154,.06);
        }
        .element-tile .num{ font-size:.55rem; align-self:flex-start; margin-left:6px; opacity:.7; }
        .element-tile .sym{ font-size:1.35rem; font-weight:700; line-height:1; }

        .brand-title{ font-weight:700; letter-spacing:.2px; }
        .brand-sub{ color:rgba(247,245,240,.55); font-size:.82rem; }

        /* Flask */
        .flask-stage{
            position:relative;
            width:150px; height:180px;
            margin:2.2rem auto 1.4rem;
        }
        .flask-neck{
            position:absolute; top:0; left:50%; transform:translateX(-50%);
            width:26px; height:46px;
            border-left:3px solid rgba(247,245,240,.65);
            border-right:3px solid rgba(247,245,240,.65);
        }
        .flask-neck::before{
            content:""; position:absolute; top:-8px; left:-6px; right:-6px; height:8px;
            border:3px solid rgba(247,245,240,.65); border-bottom:none;
            border-radius:4px 4px 0 0;
        }
        .flask-body{
            position:absolute; top:40px; left:50%; transform:translateX(-50%);
            width:0; height:0;
            border-left:62px solid transparent;
            border-right:62px solid transparent;
            border-top:118px solid transparent;
            filter: drop-shadow(0 0 0 rgba(0,0,0,0));
        }
        .flask-outline{
            position:absolute; top:40px; left:50%; transform:translateX(-50%);
            width:124px; height:118px;
            clip-path: polygon(44% 0, 56% 0, 56% 26%, 100% 92%, 100% 100%, 0 100%, 0 92%, 44% 26%);
            border:3px solid rgba(247,245,240,.65);
            box-sizing:border-box;
        }
        .flask-liquid{
            position:absolute; left:50%; transform:translateX(-50%);
            bottom:0; width:118px; height:62%;
            clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
            background:linear-gradient(180deg, var(--lab-teal), #0C9A78);
            box-sizing:border-box;
            animation: colorShift 6s ease-in-out infinite;
            overflow:hidden;
        }
        .bubble{
            position:absolute; bottom:-10px;
            width:6px; height:6px; border-radius:50%;
            background:rgba(255,255,255,.55);
            animation: rise 3.2s ease-in infinite;
        }
        .bubble:nth-child(1){ left:30%; animation-delay:.2s; width:5px; height:5px; }
        .bubble:nth-child(2){ left:50%; animation-delay:1.1s; width:7px; height:7px; }
        .bubble:nth-child(3){ left:65%; animation-delay:2s; width:4px; height:4px; }
        .bubble:nth-child(4){ left:40%; animation-delay:2.6s; width:5px; height:5px; }

        @keyframes rise{
            0%{ transform:translateY(0); opacity:0; }
            15%{ opacity:.9; }
            100%{ transform:translateY(-92px); opacity:0; }
        }
        @keyframes colorShift{
            0%, 100%{ background:linear-gradient(180deg, var(--lab-teal), #0C9A78); }
            50%{ background:linear-gradient(180deg, var(--lab-amber), #D98F1B); }
        }

        .lab-caption{
            text-align:center; font-size:.78rem;
            color:rgba(247,245,240,.5);
            letter-spacing:.03em;
        }

        /* ---------- Right panel: form ---------- */
        .lab-form-side{
            background:var(--lab-paper);
            padding:2.75rem 2.5rem;
            color:var(--lab-ink);
        }

        .form-eyebrow{
            font-size:.72rem; letter-spacing:.14em;
            color:#0C9A78; font-weight:700;
        }

        .form-title{ color:var(--lab-ink); font-weight:700; }

        .lab-alert{
            background:rgba(214,69,69,.08);
            border:1px solid rgba(214,69,69,.35);
            color:#9A3B3B;
            border-radius:10px;
        }

        .form-label{
            font-size:.82rem; font-weight:600; color:var(--lab-ink);
            display:flex; align-items:center; gap:.4rem;
        }
        .form-label .tag{
            font-size:.62rem; font-weight:700;
            color:#0C9A78; background:rgba(22,199,154,.12);
            border-radius:4px; padding:1px 6px;
        }

        .form-control{
            border:1.5px solid var(--lab-line);
            border-radius:9px;
            padding:.6rem .85rem;
            background:#fff;
        }
        .form-control:focus{
            border-color:var(--lab-teal);
            box-shadow:0 0 0 .18rem rgba(22,199,154,.18);
        }

        .btn-lab{
            background:var(--lab-navy);
            color:var(--lab-paper);
            border:none;
            border-radius:9px;
            font-weight:700;
            padding:.7rem 1rem;
            transition:background .2s ease, transform .1s ease;
        }
        .btn-lab:hover{ background:var(--lab-navy-deep); color:var(--lab-teal); }
        .btn-lab:active{ transform:translateY(1px); }

        .signup-line a{ color:#0C9A78; }
        .signup-line a:hover{ color:var(--lab-navy); }

        @media (max-width:767.98px){
            .lab-side{ min-height:auto; padding:2rem 1.5rem 1.6rem; }
            .flask-stage{ width:120px; height:150px; margin-top:1.4rem; }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4 px-3">

    <div class="lab-wrapper">
        <div class="lab-card row g-0">

            <!-- Signature side: the flask -->
            <div class="col-md-5 lab-side">
                <div class="lab-grid-lines"></div>
                <div class="position-relative">
                    <div class="d-flex align-items-center gap-3">
                        <div class="element-tile">
                            <span class="num mono">55</span>
                            <span class="sym mono">Cs</span>
                        </div>
                        <div>
                            <div class="brand-title fs-5 mono">ChemLab</div>
                            <div class="brand-sub mono">Learning Platform</div>
                        </div>
                    </div>

                    <div class="flask-stage">
                        <div class="flask-neck"></div>
                        <div class="flask-liquid">
                            <span class="bubble"></span>
                            <span class="bubble"></span>
                            <span class="bubble"></span>
                            <span class="bubble"></span>
                        </div>
                        <div class="flask-outline"></div>
                    </div>

                    <p class="lab-caption mono mb-0">// เข้าสู่ห้องปฏิบัติการของคุณ</p>
                </div>
            </div>

            <!-- Form side -->
            <div class="col-md-7 lab-form-side">
                <div class="form-eyebrow mono mb-1">SIGN IN — เข้าสู่ระบบ</div>
                <h3 class="form-title mb-4">ยินดีต้อนรับกลับ</h3>

                {% if form.errors %}
                    <div class="alert lab-alert py-2 text-center small mb-4">
                        ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">
                            <span class="tag mono">ID</span> ชื่อผู้ใช้ (Username)
                        </label>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="ระบุชื่อผู้ใช้" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">
                            <span class="tag mono">PW</span> รหัสผ่าน (Password)
                        </label>
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="ระบุรหัสผ่าน" required>
                    </div>

                    <button type="submit" class="btn btn-lab w-100 mt-3">เข้าสู่ระบบ</button>
                </form>

                <div class="text-center mt-4 signup-line">
                    <small class="text-muted">ยังไม่มีบัญชี? <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">สมัครสมาชิกที่นี่</a></small>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
